<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<meta name="theme-color" content="#0a0a1a">
<title>记录 | ishuai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=M+PLUS+Rounded+1c:wght@400;700;800&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .records-container {
    max-width:1200px; margin:100px auto 0; padding:0 16px 40px;
    column-count:3; column-gap:16px;
  }
  .article-card {
    position:relative; break-inside:avoid; margin-bottom:16px;
    border-radius:12px; overflow:hidden;
    border:1.5px solid rgba(0,255,255,0.15);
    transition:all .35s cubic-bezier(.4,0,.2,1);
    transform:rotate(var(--r,0deg));
    background:rgba(22,22,48,0.6);
  }
  .article-card:nth-child(3n+1) { --r:-1deg; }
  .article-card:nth-child(3n+2) { --r:0.8deg; }
  .article-card:nth-child(3n)   { --r:-0.5deg; }
  .article-card:nth-child(5n+1) { --r:0.9deg; }
  .article-card:nth-child(5n+4) { --r:-0.7deg; }
  .article-card:nth-child(7n+2) { --r:1deg; }
  .article-card:nth-child(7n+5) { --r:-1.1deg; }

  .article-card:hover {
    border-color:rgba(0,255,255,0.5);
    transform:rotate(0deg) translateY(-6px) scale(1.02);
    box-shadow:0 16px 48px rgba(0,0,0,0.5),0 0 0 2px rgba(0,240,255,0.2),0 0 60px rgba(0,240,255,0.1);
    z-index:20;
  }

  .article-card:nth-child(4n+1) { border-color:rgba(0,255,255,0.18); }
  .article-card:nth-child(4n+2) { border-color:rgba(255,0,170,0.14); }
  .article-card:nth-child(4n+3) { border-color:rgba(124,58,237,0.16); }
  .article-card:nth-child(4n+4) { border-color:rgba(57,255,20,0.11); }

  .article-cover { line-height:0; position:relative; overflow:hidden; }
  .article-cover .cover-img {
    width:100%; display:block;
    transition:transform .6s cubic-bezier(.4,0,.2,1);
  }
  .article-card:nth-child(odd)  .article-cover .cover-img { aspect-ratio:4/3; object-fit:cover; }
  .article-card:nth-child(even) .article-cover .cover-img { aspect-ratio:3/4; object-fit:cover; }
  .article-card:nth-child(3n)   .article-cover .cover-img { aspect-ratio:16/9; object-fit:cover; }

  .article-card:hover .cover-img { transform:scale(1.06); }

  .article-body {
    position:absolute; bottom:0; left:0; right:0;
    padding:55px 18px 18px;
    background:linear-gradient(transparent,rgba(0,0,0,0.6) 20%,rgba(0,0,0,0.92));
    pointer-events:none;
  }
  .article-date {
    font-size:11px; color:#0ff; font-family:Orbitron; margin-bottom:5px;
    text-shadow:0 1px 4px rgba(0,0,0,0.7); letter-spacing:0.5px;
  }
  .article-text {
    font-size:14px; color:#ddd; line-height:1.75;
    text-shadow:0 1px 4px rgba(0,0,0,0.7);
  }
  .article-text * { pointer-events:auto; }
  .read-more-btn {
    color:#0ff; cursor:pointer; font-size:13px;
    margin-left:4px; white-space:nowrap; transition:color .2s;
    pointer-events:auto;
  }
  .read-more-btn:hover { color:#fff; }

  .cover-thumbs {
    display:flex; gap:6px; padding:6px 10px; overflow-x:auto;
    background:rgba(0,0,0,0.5); justify-content:center; flex-wrap:wrap;
  }
  .cover-thumbs:empty { display:none; }
  .cover-thumb {
    width:50px; height:38px; object-fit:cover; border-radius:4px;
    border:2px solid transparent; cursor:pointer; opacity:.45;
    transition:border-color .2s,opacity .2s; flex-shrink:0;
  }
  .cover-thumb:hover, .cover-thumb.active { border-color:#0ff; opacity:1; }

  @media (max-width:768px) {
    .records-container { column-count:2; column-gap:12px; margin-top:80px; padding:0 10px 30px; }
    .article-card { margin-bottom:12px; }
    .article-card:hover { transform:rotate(0deg) translateY(-4px) scale(1.01); }
    .article-text { font-size:13px; }
    .article-body { padding:40px 12px 14px; }
  }
  @media (max-width:480px) {
    .records-container { column-count:1; column-gap:0; }
    .article-card { transform:none !important; margin-bottom:16px; }
    .article-card:hover { transform:translateY(-3px) scale(1.01) !important; }
    .article-card:nth-child(odd)  .article-cover .cover-img,
    .article-card:nth-child(even) .article-cover .cover-img,
    .article-card:nth-child(3n)   .article-cover .cover-img { aspect-ratio:16/9; }
  }
</style>
</head>
<body>
<div id="particles"></div>
<canvas id="matrix"></canvas>

<header id="header">
  <nav class="nav-container">
    <a href="home.html" class="logo">
      <span class="logo-bracket">[</span>
      <span class="logo-text">ishuai</span>
      <span class="logo-bracket">]</span>
    </a>
    <button class="nav-toggle" aria-label="menu" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="home.html" data-i18n="nav.home">Home</a></li>
      <li><a href="records.html" data-i18n="nav.records" class="active">记录</a></li>
      <li><a href="invest.html" data-i18n="nav.invest">投资</a></li>
      <li class="lang-switch">
        <button class="lang-btn" onclick="toggleLang(event)" aria-label="language">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          <span id="langLabel">中</span>
        </button>

          <button onclick="setLang('zh')">中文</button>

      </li>
    </ul>
  </nav>
</header>

<main>
<div class="records-container">

  <article class="article-card">
    <div class="article-cover">
      <img src="images/july-sky.jpg" class="cover-img" alt="7月的天空" loading="lazy">
    </div>
    <div class="article-body">
      <div class="article-date">2026-07-08</div>
      <div class="article-text">7月的天空...</div>
    </div>
  </article>

  <article class="article-card">
    <div class="article-cover">
      <img src="images/jiaozi.jpg" class="cover-img" alt="小黑煎饺" loading="lazy">
    </div>
    <div class="article-body">
      <div class="article-date">2026-07-07</div>
      <div class="article-text">
        一家叫「小黑煎饺」的早餐店，承载着一代望江本地人的回忆。从高中起就开始吃的煎饺，位置就在水木清华单元楼的下面，必须是菜饺子蘸醋才好吃，价格这些年也涨了不少。
      </div>
    </div>
  </article>

  <article class="article-card">
    <div class="article-cover">
      <img src="images/daily_0706_1.jpg" class="cover-img" alt="" loading="lazy">
      <img src="images/daily_0706_2.jpg" loading="lazy">
    </div>
    <div class="article-body">
      <div class="article-date">2026-07-06</div>
      <div class="article-text">日常...</div>
    </div>
  </article>

</div>
</main>

<footer>
  <p>© 2026 shuai · <span data-i18n="footer.powered">Powered by</span> <span class="footer-accent">Code & Coffee ☕</span></p>
  <p class="footer-jp" data-i18n="footer.jp">このページは愛と情熱で作られました</p>
</footer>

<script src="i18n.js"></script>
<script src="main.js"></script>
<script>
document.querySelectorAll('.article-cover').forEach(cover => {
  const imgs = cover.querySelectorAll('img');
  if (imgs.length <= 1) return;
  const mainImg = imgs[0];
  mainImg.classList.add('cover-img');
  for (let i = 1; i < imgs.length; i++) imgs[i].style.display = 'none';

  const thumbs = document.createElement('div');
  thumbs.className = 'cover-thumbs';
  imgs.forEach((img, i) => {
    const t = document.createElement('img');
    t.src = img.src;
    t.className = 'cover-thumb' + (i === 0 ? ' active' : '');
    t.onclick = function() {
      mainImg.src = t.src;
      thumbs.querySelectorAll('.cover-thumb').forEach(el => el.classList.remove('active'));
      t.classList.add('active');
    };
    thumbs.appendChild(t);
  });
  cover.appendChild(thumbs);
});

document.querySelectorAll('.article-text').forEach(el => {
  const text = el.textContent.trim();
  if (text.length <= 50) return;
  const fullHTML = el.innerHTML;
  el.innerHTML = text.slice(0, 50) + '... <span class="read-more-btn" onclick="expandText(this)">【阅读全文】</span>';
  el.dataset.fullHTML = fullHTML;
});

function expandText(btn) {
  const el = btn.closest('.article-text');
  el.innerHTML = el.dataset.fullHTML;
}
</script>
</body>
</html>
